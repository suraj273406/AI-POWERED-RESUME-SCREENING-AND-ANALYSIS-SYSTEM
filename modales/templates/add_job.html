<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Job</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            color: #1e293b;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
        }

        .message {
            color: #15803d;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add New Job</h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form action="{{ url_for('add_job') }}" method="POST">

        <label>Job Title</label>
        <input
            type="text"
            name="title"
            placeholder="Enter Job Title"
            required
        >

        <label>Job Description</label>
        <textarea
            name="description"
            placeholder="Enter Job Description"
        ></textarea>

        <label>Required Skills</label>
        <textarea
            name="required_skills"
            placeholder="Python, Flask, MySQL, HTML, CSS"
        ></textarea>

        <button type="submit">Add Job</button>

    </form>

    <a href="{{ url_for('jobs') }}">View All Jobs</a>

    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

</div>

</body>
</html>
